{% extends "base.html" %}

{% block content %}
  <section class="stack">
    <section class="card course-head access-locked-card">
      <div class="hero-bg-visual hero-bg-desktop" aria-hidden="true">
        <img src="/static/images/human_ai_hero_background_v2.png" alt="" decoding="async" draggable="false">
      </div>
      <div class="hero-bg-visual hero-bg-mobile" aria-hidden="true">
        <img src="/static/images/mobile_vitruvian_NO_SQUARES_transparent.webp" alt="" decoding="async" draggable="false">
      </div>
      <div class="hero-wrap">
        <div class="hero-copy access-locked-copy">
          <div class="access-locked-panel">
            <div class="course-access-badge access-locked-badge" role="status" aria-live="polite">
              <p>Доступ ограничен</p>
              {% if current_user %}
                <p>Вы вошли как {{ current_user.login }}.</p>
              {% endif %}
            </div>
            <h2 class="section-title">{{ locked_title }}</h2>
            <p class="form-help">{{ locked_message }}</p>
            <div class="access-locked-chips" aria-label="Что откроется после оплаты">
              <span class="access-locked-chip">Личный кабинет</span>
              <span class="access-locked-chip">Обучение</span>
              <span class="access-locked-chip">Материалы</span>
            </div>
            <p class="access-locked-note">После оплаты тариф откроет этот раздел без лишних переходов.</p>
          </div>
        </div>
      </div>
    </section>
  </section>
{% endblock %}
